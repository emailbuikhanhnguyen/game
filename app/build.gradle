plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nguyen.bephieuluu'
    compileSdk 35

    defaultConfig {
        applicationId "com.nguyen.bephieuluu"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
